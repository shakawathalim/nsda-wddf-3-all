<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | NexaCode Solutions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="contact" data-title="Contact">
<div id="site-header"></div>

<main>
<section class="section">
  <div class="container">
    <div class="row g-5">
      <div class="col-lg-7">
        <h2 class="h4 mb-3">Send us a message</h2>
        <form id="contactForm" class="row g-3 needs-validation" novalidate>
          <div class="col-md-6"><label for="cName" class="form-label">Name</label><input id="cName" class="form-control" required autocomplete="name"><div class="invalid-feedback">Enter your name.</div></div>
          <div class="col-md-6"><label for="cEmail" class="form-label">Email</label><input id="cEmail" type="email" class="form-control" required autocomplete="email"><div class="invalid-feedback">Enter a valid email address, like name@example.com.</div></div>
          <div class="col-12"><label for="cSubject" class="form-label">Subject</label><input id="cSubject" class="form-control" required><div class="invalid-feedback">Enter a subject.</div></div>
          <div class="col-12"><label for="cMessage" class="form-label">Message</label><textarea id="cMessage" class="form-control" rows="5" minlength="10" required></textarea><div class="invalid-feedback">Write at least 10 characters.</div></div>
          <div class="col-12"><button class="btn btn-navy" type="submit">Send message</button></div>
        </form>
      </div>
      <div class="col-lg-5">
        <h2 class="h4 mb-3">Contact details</h2>
        <div class="card mb-3"><div class="card-body d-flex gap-3"><i class="bi bi-geo-alt fs-3 text-warning"></i><div><h3 class="h6 mb-0">Address</h3><span class="text-secondary">Agrabad Commercial Area, Chattogram, Bangladesh</span></div></div></div>
        <div class="card mb-3"><div class="card-body d-flex gap-3"><i class="bi bi-telephone fs-3 text-warning"></i><div><h3 class="h6 mb-0">Phone</h3><a href="tel:+8801700000000">+880 1700-000000</a></div></div></div>
        <div class="card"><div class="card-body d-flex gap-3"><i class="bi bi-envelope fs-3 text-warning"></i><div><h3 class="h6 mb-0">Email</h3><a href="mailto:info@nexacode.example">info@nexacode.example</a></div></div></div>
      </div>
    </div>
    <h2 class="h4 mt-5 mb-3">Find us on the map</h2>
    <iframe class="map" title="Company location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Agrabad+Commercial+Area+Chattogram+Bangladesh&output=embed"></iframe>
  </div>
</section>

<!-- Confirmation popup -->
<div class="modal fade" id="okModal" tabindex="-1" aria-labelledby="okTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5" id="okTitle"><i class="bi bi-check-circle-fill text-success"></i> Message sent</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body" id="okText"></div>
    <div class="modal-footer"><button type="button" class="btn btn-navy" data-bs-dismiss="modal">OK</button></div>
  </div></div>
</div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
